services:

  visure-service:
    build: .
    container_name: visure-service
    restart: unless-stopped

    ports:
      - "127.0.0.1:8001:8000"   # solo localhost → nginx host fa da proxy

    environment:
      - PYTHONUNBUFFERED=1
      - DISPLAY=:99
      - HOST=visura.malerba.info
      - PROTOCOL=https

    env_file:
      - .env

    volumes:
      - ./logs:/app/logs:rw

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    networks:
      - crawl_net   # stessa rete di n8n e crawl4ai → comunicano per nome container

networks:
  crawl_net:
    external: true
